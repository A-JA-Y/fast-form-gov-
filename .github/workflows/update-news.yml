name: Update news feed

on:
  schedule:
    - cron: "17 2 * * *" # daily, 02:17 UTC (07:47 IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch latest headlines
        run: node scripts/update-news.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- news.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "chore: refresh news feed"
          git push
